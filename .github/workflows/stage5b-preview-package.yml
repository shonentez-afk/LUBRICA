name: LUBRICA Stage 5D Saw Shaft Preview ZIP

on:
  pull_request:
    branches: [main]
    paths:
      - 'conveyors/**'
      - 'machines/saw-cut-arrangement.js'
      - 'rotating/rotating-arrangement.js'
      - 'test/test_stage5d_saws_shafts.js'
      - 'qa/point-acceleration*.js'
      - 'qa/engineering-decisions.js'
      - 'qa/safe-bulk.js'
      - 'ui/bulk-edit.js'
      - 'test/test_stage5c_point_acceleration.js'
      - 'qa/qa-ui.js'
      - 'index.html'
      - 'test/test_release_1_0_33_76_conveyor_coverage.js'
      - 'test/test_release_1_0_33_77_two_shaft_support_guard.js'
      - 'test/test_release_1_0_33_78_conveyor_ui_ux.js'
      - 'assets/app.css'
      - 'import/component-classifier.js'
      - 'import/candidate-finalizer.js'
      - 'structure/entity-dialogs.js'
      - 'structure/detail-ui.js'
      - 'test/test_release_1_0_33_73_conveyor_families.js'
      - 'test/test_release_1_0_33_75_composite_conveyor_ui.js'
      - '.github/workflows/stage5b-preview-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and targeted constructor contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check import/component-classifier.js
          node --check conveyors/conveyor-arrangement.js
          node --check machines/saw-cut-arrangement.js
          node --check rotating/rotating-arrangement.js
          node --check conveyors/bearing-verification.js
          node --check qa/point-acceleration.js
          node --check qa/point-acceleration-ui.js
          node --check qa/safe-bulk.js
          node --check conveyors/conveyor-coverage.js
          node --check qa/qa-ui.js
          node --check import/candidate-finalizer.js
          node --check structure/entity-dialogs.js
          node --check structure/detail-ui.js
          node test/test_release_1_0_33_73_conveyor_families.js
          node test/test_release_1_0_33_74_conveyor_header.js
          node test/test_release_1_0_33_75_composite_conveyor_ui.js
          node test/test_release_1_0_33_76_conveyor_coverage.js
          node test/test_release_1_0_33_77_two_shaft_support_guard.js
          node test/test_release_1_0_33_78_conveyor_ui_ux.js
          node test/test_stage5c_point_acceleration.js
          node test/test_stage5d_saws_shafts.js
          node tests/test_release_1_0_33_47_chain_scraper_conveyor.js
          node tests/test_release_1_0_33_14_manual_conveyor_parity.js
          node tests/test_release_1_0_33_15_conveyor_bearing_assignment.js
          node tests/test_release_1_0_33_17_conveyor_live_template_refresh.js
      - name: Assemble isolated Edge file preview
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a ./ "$STAGE/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'test/' \
            --exclude 'tests/' \
            --exclude 'project/' \
            --exclude 'acceptance/' \
            --exclude 'releases/' \
            --exclude 'README.md' \
            --exclude 'START_NEW_CHAT_RU.md'
          find "$STAGE" -maxdepth 1 -type f \( \
            -name 'RELEASE_*.md' -o \
            -name 'LUBRICA_*.md' -o \
            -name 'LUBRICA_*.txt' -o \
            -name 'LUBRICA_*.json' -o \
            -name 'LUBRICA_*.csv' \
          \) -delete
          cat > "$STAGE/ПРОВЕРКА_ПИЛ_ВАЛОВ_STAGE5D.txt" <<'EOF'
          LUBRICA — Stage 5D: ПИЛЫ, РЕЗКА, КАРЕТКИ И ВАЛЫ.
          ТЕСТОВАЯ СБОРКА ИЗ DRAFT PR, НЕ ПРИНЯТЫЙ РЕЛИЗ.
          Baseline manifest.json остаётся 1.0.33.71, основная программа не заменена.
          ПРИЛОЖЕНИЕ НЕ СОДЕРЖИТ ПОЛЬЗОВАТЕЛЬСКУЮ БАЗУ.

          1. Распакуйте ZIP в отдельную папку и откройте index.html через Edge file://.
          2. Работайте исключительно с РЕЗЕРВНОЙ КОПИЕЙ JSON базы.
          3. В Структуре откройте Пилы ленточные 10110181 и пилу №1 10110182.
          4. Проверьте дочернее колесо 10110196, реальные ТМЦ, обозначения и ID.
          5. Проверьте каретки 10110384, 10110415 и зеркальные машины линии 102.
          6. Подшипники 2RS/2CS и полимерные направляющие не должны
             автоматически получить досмазку без отдельной OEM-процедуры.
          7. Откройте существующий конструктор вала: количество по умолчанию
             НЕИЗВЕСТНО, отсутствие ТМЦ не создаёт виртуальных опор.
          8. Сохраните черновик, затем подтвердите 1-6 реальных мест по источнику;
             оцените сохранность названия, ID источника и реального доступа.
          9. Повторно примените ту же конструкцию: дублей быть не должно.
          10. Сверьте утверждённые мероприятия, маршруты, факты и повторную
              загрузку JSON: существующие записи не должны изменяться.
          11. Не создавайте производственные маршруты до готовности всей карты.

          Остальные семейства не развиваются в этой стадии.
          EOF
      - name: Verify offline scripts and no bundled plant JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW" <<'PY'
          import pathlib,re,sys,json
          root=pathlib.Path(sys.argv[1])
          needed=['index.html','manifest.json','conveyors/conveyor-arrangement.js',
                  'conveyors/conveyor-coverage.js','conveyors/bearing-verification.js',
                  'rotating/rotating-arrangement.js','machines/saw-cut-arrangement.js',
                  'qa/qa-ui.js','qa/point-acceleration.js','qa/point-acceleration-ui.js','qa/safe-bulk.js',
                  'import/component-classifier.js','import/candidate-finalizer.js',
                  'structure/entity-dialogs.js','structure/detail-ui.js',
                  'assets/app.css']
          for name in needed:
              assert (root/name).is_file(),f'Runtime file missing: {name}'
          assert not (root/'project').exists() and not (root/'test').exists()
          html=(root/'index.html').read_text(encoding='utf-8')
          for local in re.findall(r'(?:src|href)=["\x27](\./[^"\x27]+)["\x27]',html):
              name=local.removeprefix('./').split('?')[0].split('#')[0]
              assert (root/name).exists(),f'Broken offline asset: {local}'
          data=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert data['appVersion']=='1.0.33.71'
          assert 'conveyorIdentity' in (root/'import/component-classifier.js').read_text(encoding='utf-8')
          print('Stage 5B runtime package OK')
          PY
      - name: ZIP and SHA-256 integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW.zip" LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW
          cd "$GITHUB_WORKSPACE"
          unzip -tq LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW.zip | tail -n 2
          sha256sum LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW.zip > LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW.zip.sha256
          sha256sum -c LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW.zip.sha256
      - name: Upload artifact for manual Edge acceptance
        uses: actions/upload-artifact@v4
        with:
          name: LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW
          path: |
            LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW.zip
            LUBRICA_STAGE5D_SAW_SHAFT_PREVIEW.zip.sha256
          if-no-files-found: error
          retention-days: 30
