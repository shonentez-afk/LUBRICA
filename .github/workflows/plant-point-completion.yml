name: Plant Point Completion Stage 1-3

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/**'
      - 'import/candidate-finalizer.js'
      - 'import/component-classifier.js'
      - 'index.html'
      - 'assets/app.css'
      - 'test/test_release_1_0_33_69_candidate_decisions.js'
      - 'test/test_release_1_0_33_71_task_readiness_safe_analog.js'
      - 'qa/task-readiness.js'
      - 'qa/task-readiness-ui.js'
      - 'lubrication/analog-transfer.js'
      - 'materials/**'
      - 'test/test_release_1_0_33_72_material_passport_guard.js'
      - 'test/test_release_1_0_33_72_material_ui_smoke.js'
      - 'test/test_release_1_0_33_69_plant_point_completion.js'
      - 'test/run_all.sh'
      - '.github/workflows/plant-point-completion.yml'
  workflow_dispatch:

concurrency:
  group: plant-point-completion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Python dependencies for existing regression
        run: python -m pip install --disable-pip-version-check beautifulsoup4 openpyxl pillow
      - name: Plant point targeted acceptance
        run: node test/test_release_1_0_33_69_plant_point_completion.js
      - name: Stage 2 physical candidate decisions
        run: node test/test_release_1_0_33_69_candidate_decisions.js
      - name: Stage 3 readiness and safe physical analog
        run: node test/test_release_1_0_33_71_task_readiness_safe_analog.js
      - name: Stage 4 material passport correction
        run: node test/test_release_1_0_33_72_material_passport_guard.js
      - name: Stage 4 offline material editor smoke
        run: node test/test_release_1_0_33_72_material_ui_smoke.js
      - name: Existing QA contracts
        run: |
          node test/test_stage9_8_program_qa.js
          python test/test_stage9_8_program_qa_ui.py
      - name: Full LUBRICA regression
        run: bash test/run_all.sh
