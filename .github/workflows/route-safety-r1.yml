name: LUBRICA Route Safety R1

on:
  pull_request:
    branches:
      - feature/stage5b-conveyor-families-20261105
      - main
    paths:
      - 'routes/**'
      - 'checklist/**'
      - 'test/run_all.sh'
      - 'test/test_route_safety_stage_r1.js'
      - 'test/test_stage9_1_7_route_creation.js'
      - 'test/test_stage9_3_route_planning.js'
      - '.github/workflows/route-safety-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regression Python dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 openpyxl pillow
      - name: Syntax
        run: |
          node --check routes/route-engine.js
          node --check routes/route-planning.js
          node --check routes/route-preparation.js
          node --check routes/route-planning-ui.js
          node --check routes/routes-ui.js
          node --check checklist/checklist-engine.js
          node --check test/test_route_safety_stage_r1.js
      - name: Route safety R1
        run: node test/test_route_safety_stage_r1.js
      - name: Full regression
        run: bash test/run_all.sh
      - name: Build isolated Edge file preview
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/LUBRICA_ROUTE_SAFETY_R1_PREVIEW"
          mkdir -p "$STAGE"
          rsync -a ./ "$STAGE/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'test/' \
            --exclude 'tests/' \
            --exclude 'project/' \
            --exclude 'acceptance/' \
            --exclude 'releases/' \
            --exclude 'README.md' \
            --exclude 'START_NEW_CHAT_RU.md'
          find "$STAGE" -maxdepth 1 -type f \( -name 'RELEASE_*.md' -o -name 'LUBRICA_*.md' -o -name 'LUBRICA_*.txt' -o -name 'LUBRICA_*.json' -o -name 'LUBRICA_*.csv' \) -delete
          printf '%s\n' 'LUBRICA ROUTE SAFETY STAGE R1' 'Draft preview, not a production release.' 'Use Edge file:// with a BACKUP COPY of plant JSON only.' 'Do not create production routes before K3/M1 acceptance.' 'Check QA readiness, duplicates, archive, monthly planning and checklist skips.' > "$STAGE/ROUTE_R1_README.txt"
          test -f "$STAGE/index.html"
          test -f "$STAGE/manifest.json"
          test -f "$STAGE/routes/route-engine.js"
          test -f "$STAGE/routes/route-planning.js"
          test -f "$STAGE/checklist/checklist-engine.js"
          test ! -d "$STAGE/project"
          test ! -d "$STAGE/test"
      - name: ZIP and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/LUBRICA_ROUTE_SAFETY_R1_PREVIEW.zip" LUBRICA_ROUTE_SAFETY_R1_PREVIEW
          cd "$GITHUB_WORKSPACE"
          unzip -tq LUBRICA_ROUTE_SAFETY_R1_PREVIEW.zip
          sha256sum LUBRICA_ROUTE_SAFETY_R1_PREVIEW.zip > LUBRICA_ROUTE_SAFETY_R1_PREVIEW.zip.sha256
          sha256sum -c LUBRICA_ROUTE_SAFETY_R1_PREVIEW.zip.sha256
      - name: Upload ZIP for manual Edge QA
        uses: actions/upload-artifact@v4
        with:
          name: LUBRICA_ROUTE_SAFETY_R1_PREVIEW
          path: |
            LUBRICA_ROUTE_SAFETY_R1_PREVIEW.zip
            LUBRICA_ROUTE_SAFETY_R1_PREVIEW.zip.sha256
          if-no-files-found: error
          retention-days: 30
