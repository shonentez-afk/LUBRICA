name: Package LUBRICA 1.0.33.68

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-1.0.33.68.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accepted main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert m.get('appVersion') == '1.0.33.68', m
          assert m.get('version') == '1.0.33.68', m
          print('Release version verified:', m['appVersion'])
          PY

      - name: Production preflight
        run: python3 test/preflight.py

      - name: Build clean production directory
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/LUBRICA_1_0_33_68"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          rsync -a ./ "$STAGE/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'test/' \
            --exclude 'tests/' \
            --exclude 'project/' \
            --exclude 'acceptance/' \
            --exclude 'releases/' \
            --exclude 'README.md' \
            --exclude 'START_NEW_CHAT_RU.md'

          find "$STAGE" -maxdepth 1 -type f \( \
            -name 'RELEASE_*.md' -o \
            -name 'LUBRICA_*.md' -o \
            -name 'LUBRICA_*.txt' -o \
            -name 'LUBRICA_*.json' -o \
            -name 'LUBRICA_*.csv' \
          \) -delete

          test -f "$STAGE/index.html"
          test -f "$STAGE/manifest.json"
          test -f "$STAGE/Создать ярлык LUBRICA.bat"
          test -f "$STAGE/assets/icons/lubrica-header.png"
          test -f "$STAGE/assets/icons/lubrica-shortcut.ico"
          test -d "$STAGE/assets/oem"
          test -d "$STAGE/calculations"
          test -d "$STAGE/components"
          test -d "$STAGE/core"
          test -d "$STAGE/machines"
          test -d "$STAGE/routes"

          python3 - "$STAGE" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert m['appVersion']=='1.0.33.68'
          files=[p for p in root.rglob('*') if p.is_file()]
          print('Production files:', len(files))
          print('Production bytes:', sum(p.stat().st_size for p in files))
          PY

      - name: Create ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/LUBRICA_RELEASE_1_0_33_68.zip" LUBRICA_1_0_33_68
          cd "$GITHUB_WORKSPACE"
          sha256sum LUBRICA_RELEASE_1_0_33_68.zip > LUBRICA_RELEASE_1_0_33_68.zip.sha256
          cat LUBRICA_RELEASE_1_0_33_68.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUBRICA_RELEASE_1_0_33_68
          path: |
            LUBRICA_RELEASE_1_0_33_68.zip
            LUBRICA_RELEASE_1_0_33_68.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.0.33.68'
          TITLE='LUBRICA 1.0.33.68 — PP-53736 Full Machine Acceptance & Runtime-Hour Planning'
          NOTE='releases/RELEASE_1_0_33_68_PP53736_FULL_MACHINE_RUNTIME_PLANNING.md'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              LUBRICA_RELEASE_1_0_33_68.zip \
              LUBRICA_RELEASE_1_0_33_68.zip.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              LUBRICA_RELEASE_1_0_33_68.zip \
              LUBRICA_RELEASE_1_0_33_68.zip.sha256 \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTE"
          fi
