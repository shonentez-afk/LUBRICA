name: LUBRICA Routes R2–R6.4 Chromium UX and file origin

on:
  pull_request:
    branches:
      - feature/stage5b-conveyor-families-20261105
      - main
    paths:
      - 'routes/routes-ui.js'
      - 'routes/route-engine.js'
      - 'routes/route-auto-grouping.js'
      - 'routes/route-due.js'
      - 'routes/route-workload.js'
      - 'routes/route-workload-ui.js'
      - 'routes/route-automation.js'
      - 'routes/route-automation-ui.js'
      - 'assets/route-automation.css'
      - 'test/test_route_automation_r5_browser.py'
      - 'test/test_route_r6_file_browser.py'
      - 'test/route_r6_fixture.js'
      - 'core/database-*.js'
      - 'assets/route-workload.css'
      - 'test/test_route_workload_r4_browser.py'
      - 'routes/route-planning.js'
      - 'routes/route-planning-ui.js'
      - 'test/test_route_due_r3b_browser.py'
      - 'test/test_route_auto_grouping_r3a_browser.py'
      - 'routes/route-compact-ui.js'
      - 'checklist/checklist-engine.js'
      - 'assets/route-compact.css'
      - 'index.html'
      - 'test/test_route_execution_compact_r2_browser.py'
      - '.github/workflows/route-walkthrough-r2-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Real route UI execution, responsive layout and screenshots
        run: |
          python test/test_route_execution_compact_r2_browser.py
          python test/test_route_auto_grouping_r3a_browser.py
          python test/test_route_due_r3b_browser.py
          python test/test_route_workload_r4_browser.py
          python test/test_route_automation_r5_browser.py
          python test/test_route_r6_file_browser.py
      - name: Export screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUBRICA_ROUTES_R6_4_CHROMIUM_SCREENSHOTS
          path: |
            test-artifacts/routes-r2/*.png
            test-artifacts/routes-r3a/*.png
            test-artifacts/routes-r3b/*.png
            test-artifacts/routes-r4/*.png
            test-artifacts/routes-r5/*.png
            test-artifacts/routes-r6/*.png
          if-no-files-found: warn
          retention-days: 30
